name: Build

on: [ push, pull_request, release ]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        # os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
#      - uses: actions/setup-python@master
#        with:
#          python-version: '3.12'
#
      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: '3.12'
          channels: https://fsl.fmrib.ox.ac.uk/fsldownloads/fslconda/public/, conda-forge, conda-pypi
      - name: Checkout imagedata_registration
        uses: actions/checkout@master

      - name: Lint with flake8
        run: |
          pip install --upgrade pip flake8
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          # Skip 32-bit builds
          # Disable building PyPy wheels on all platforms
          # Skip all musllinux (manylinux only supported by itk-io)
          # CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp313t-* cp314-* cp314t-*"
          # CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_BUILD: "cp312-*"
          # CIBW_ENABLE: "cpython-freethreading"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux*"
          CIBW_BEFORE_ALL_LINUX: curl -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: "PATH=$HOME/.cargo/bin:$PATH"
          NPY_NO_DEPRECATED_API: "NPY_1_7_API_VERSION"

      - name: Testing - with Cython
        shell: bash
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          conda install fsl-bet2 fsl-eddy fsl-topup fsl-mcflirt install cython numpy flake8 coverage nipype
          python3 -m pip install -e .
          python3 -m coverage run -m unittest discover tests -t .
      - name: Testing - without Cython
        shell: bash
        run: |
          find . -name '*.so' | xargs rm
          python3 -m coverage run -m unittest discover tests -t .
      - uses: actions/upload-artifact@v6
        with:
          name: artifact.${{ matrix.os }}
          path: ./wheelhouse/*.whl
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: true
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: erling6232/imagedata_registration


  publish-to-pypi:
    name: Publish Python distribution to PyPi
    # if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    # needs: [build_wheels, build_sdist]
    needs: [ build_wheels ]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'
    # or, alternatively, upload to PyPI on every tag starting with 'v' (remove on: release above to use this)
    # if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download the ubuntu-22.latest dists
        uses: actions/download-artifact@v4
        with:
          # unpacks default artifact into dist/
          # if `name: artifact` is omitted, the action will create extra parent dir
          name: artifact.ubuntu-latest
          path: dist

      - name: Download the macos-latest dists
        uses: actions/download-artifact@v4
        with:
          # unpacks default artifact into dist/
          # if `name: artifact` is omitted, the action will create extra parent dir
          name: artifact.macos-latest
          path: dist

      - name: Download the windows-latest dists
        uses: actions/download-artifact@v4
        with:
          # unpacks default artifact into dist/
          # if `name: artifact` is omitted, the action will create extra parent dir
          name: artifact.windows-latest
          path: dist

      - name: Upload distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

